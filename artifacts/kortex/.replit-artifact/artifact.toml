kind = "web"
previewPath = "/"
title = "Kortex AI"
version = "1.0.0"
id = "artifacts/kortex"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19009

[services.development]
run = "pnpm --filter @workspace/kortex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kortex", "run", "build" ]
publicDir = "artifacts/kortex/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19009"
BASE_PATH = "/"
